<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Build Your Burrito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ---- Brand tokens (swap these to match the official palette) ---- */
  :root {
    --cb-red: #D8463B;
    --cb-red-deep: #B4362D;
    --cb-yellow: #F5B83D;
    --cb-cream: #FFF5E6;
    --cb-teal: #2E8C80;

    --bg: #F7E9D7;
    --panel: #FFFDF8;
    --ink: #3B2A23;
    --ink-soft: #7C665B;
    --line: rgba(59, 42, 35, .12);
    --chip: #FFF8EE;
    --chip-hover: #FFF0DA;
    --chip-on: #FFE6B3;
    --shadow: 0 18px 40px -18px rgba(80, 40, 20, .35), 0 2px 8px rgba(80, 40, 20, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1E1815;
      --panel: #2A221E;
      --ink: #F6EADF;
      --ink-soft: #BBA99D;
      --line: rgba(255, 255, 255, .1);
      --chip: #342A25;
      --chip-hover: #3D312B;
      --chip-on: #54401F;
      --shadow: 0 18px 40px -18px rgba(0, 0, 0, .7), 0 2px 8px rgba(0, 0, 0, .3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1E1815; --panel: #2A221E; --ink: #F6EADF; --ink-soft: #BBA99D;
    --line: rgba(255, 255, 255, .1); --chip: #342A25; --chip-hover: #3D312B; --chip-on: #54401F;
    --shadow: 0 18px 40px -18px rgba(0, 0, 0, .7), 0 2px 8px rgba(0, 0, 0, .3);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Nunito", system-ui, sans-serif;
    display: grid;
    grid-template-rows: auto 1fr;
    grid-template-columns: minmax(0, 1fr);
    height: 100dvh;
    overflow: hidden;
    width: 100%;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }

  /* ---- Header ---- */
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 12px 20px;
    background: var(--cb-red);
    color: var(--cb-cream);
    position: relative; z-index: 3;
    box-shadow: 0 4px 0 var(--cb-red-deep);
  }
  .brand { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .brand svg { width: 38px; height: 38px; }
  .brand b { font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 20px; letter-spacing: .2px; display: block; line-height: 1.05; }
  .brand small { font-size: 12px; opacity: .85; font-weight: 600; }
  .steps { display: flex; gap: 6px; margin-left: auto; min-width: 0; overflow-x: auto; scrollbar-width: none; }
  .steps::-webkit-scrollbar { display: none; }
  .steps button {
    border: 0; cursor: pointer; white-space: nowrap;
    background: rgba(255, 245, 230, .14);
    color: var(--cb-cream);
    font-weight: 700; font-size: 13px;
    padding: 7px 12px; border-radius: 999px;
    display: flex; align-items: center; gap: 6px;
    transition: background .2s, color .2s, opacity .2s;
  }
  .steps button .n {
    width: 18px; height: 18px; border-radius: 50%;
    display: grid; place-items: center; font-size: 11px;
    background: rgba(255, 245, 230, .2);
  }
  .steps button.done .n { background: var(--cb-yellow); color: var(--cb-red-deep); }
  .steps button.cur { background: var(--cb-cream); color: var(--cb-red-deep); }
  .steps button.cur .n { background: var(--cb-red); color: var(--cb-cream); }
  .steps button:disabled { opacity: .45; cursor: default; }
  .steps button:not(:disabled):not(.cur):hover { background: rgba(255, 245, 230, .26); }
  @media (max-width: 760px) {
    header { padding: 10px 16px; }
    .brand small { display: none; }
    .steps button .t { display: none; }
    .steps button { padding: 5px; }
    .steps button.cur .t { display: inline; padding-right: 4px; }
  }

  /* ---- Stage ---- */
  .stage { position: relative; overflow: hidden; background: #EFDCC4; }
  #cam {
    position: absolute; left: 0; top: 0;
    transform-origin: 0 0;
    transition: transform 1.1s cubic-bezier(.65, 0, .25, 1);
    will-change: transform;
  }
  #cam.instant { transition: none; }
  #scene { display: block; }
  .grain {
    position: absolute; inset: 0; pointer-events: none; opacity: .22; mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .32  0 0 0 0 .22  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  .vignette {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(120% 90% at 50% 35%, transparent 55%, rgba(70, 35, 15, .18));
  }

  /* SVG interactions */
  .pan .lift { transition: transform .25s cubic-bezier(.3, 1.6, .5, 1); transform-box: fill-box; transform-origin: center; }
  .station:not(.active) .pan { pointer-events: none; }
  .station.active .pan { cursor: pointer; }
  .station.active .pan:hover .lift { transform: translateY(-4px) scale(1.03); }
  .pan .ring, .pan .tick { opacity: 0; transition: opacity .25s; }
  .pan.on .ring, .pan.on .tick { opacity: 1; }
  .pan .label rect { transition: fill .25s; }
  .pan.on .label rect { fill: var(--cb-yellow); }
  .glow { transition: opacity .8s; opacity: .22; }
  .glow.on { opacity: .75; }
  #tray, #me, #bubble { transition: transform 1.1s cubic-bezier(.65, 0, .25, 1); }
  #tray.instant, #me.instant { transition: none; }
  #me.walking .body { animation: waddle .32s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
  @keyframes waddle { from { transform: rotate(-4deg) translateY(-1px); } to { transform: rotate(4deg) translateY(1px); } }
  .staff .bob { transform-box: fill-box; transform-origin: center; }
  .staff.talk .bob { animation: nod 1.4s ease-in-out infinite; }
  @keyframes nod { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04) translateY(2px); } }
  .pop { animation: pop .45s cubic-bezier(.3, 1.5, .5, 1) both; transform-box: fill-box; transform-origin: center; }
  @keyframes pop { from { opacity: 0; transform: scale(1.25) translateY(-6px); } to { opacity: 1; transform: none; } }
  .fade-out { transition: opacity .3s; opacity: 0; }
  #bubbleInner { transform-box: fill-box; transform-origin: 50% 100%; }
  #bubbleInner.pop { animation: bpop .4s cubic-bezier(.3, 1.6, .5, 1) both; }
  @keyframes bpop { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }
  .wrap-in { animation: wrapin .7s cubic-bezier(.3, 1.4, .5, 1) both; transform-box: fill-box; transform-origin: center; }
  @keyframes wrapin { from { opacity: 0; transform: scale(1.3) rotate(-6deg); } to { opacity: 1; transform: none; } }
  .shrink { transition: opacity .45s, transform .45s; opacity: 0; transform: scaleY(.4); transform-box: fill-box; transform-origin: center; }
  .ding { animation: ding .6s ease-in-out 2; transform-box: fill-box; transform-origin: center; }
  @keyframes ding { 25% { transform: rotate(-14deg); } 75% { transform: rotate(14deg); } }
  .sparkle { animation: sparkle 1.2s ease-out both; }
  @keyframes sparkle { from { opacity: 1; stroke-dashoffset: 0; } to { opacity: 0; stroke-dashoffset: -30; } }

  /* ---- Panel ---- */
  .panel {
    position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
    width: min(900px, calc(100% - 24px));
    background: var(--panel);
    border-radius: 24px;
    box-shadow: var(--shadow);
    padding: 16px 18px 14px;
    z-index: 2;
    border: 1px solid var(--line);
  }
  .phead { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .kicker { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--cb-red); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .kicker { color: #F08A7E; } }
  :root[data-theme="dark"] .kicker { color: #F08A7E; }
  h2 { font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 24px; margin: 2px 0 0; line-height: 1.15; }
  .hint { font-size: 13px; color: var(--ink-soft); font-weight: 600; text-align: right; }
  .chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
  .chip {
    min-width: 0;
    display: flex; align-items: center; gap: 10px; text-align: left;
    padding: 8px 12px 8px 8px;
    border-radius: 16px; border: 2px solid transparent;
    background: var(--chip); cursor: pointer;
    transition: background .2s, border-color .2s, transform .15s;
    position: relative;
  }
  .chip:hover { background: var(--chip-hover); }
  .chip:active { transform: scale(.98); }
  .chip.on { background: var(--chip-on); border-color: var(--cb-yellow); }
  .chip.shake { animation: shake .35s; }
  @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  .chip svg.sw { width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; box-shadow: 0 2px 6px rgba(60, 30, 10, .18); }
  .chip .nm { font-weight: 800; font-size: 14.5px; line-height: 1.2; display: flex; align-items: center; gap: 6px; }
  .chip .sb { font-size: 12.5px; color: var(--ink-soft); font-weight: 600; line-height: 1.25; margin-top: 1px; }
  .chip .ck {
    position: absolute; top: 6px; right: 8px; width: 20px; height: 20px; border-radius: 50%;
    background: var(--cb-red); color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 900;
    transform: scale(0); transition: transform .25s cubic-bezier(.3, 1.6, .5, 1);
  }
  .chip.on .ck { transform: scale(1); }
  .vm { width: 12px; height: 12px; border: 1.6px solid; border-radius: 2px; display: inline-grid; place-items: center; flex-shrink: 0; }
  .vm::after { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
  .vm.veg { color: #2F8F3A; }
  .vm.nv { color: #9A3B24; }
  .vm.nv::after { border-radius: 0; width: 0; height: 0; background: none; border-left: 3.5px solid transparent; border-right: 3.5px solid transparent; border-bottom: 6px solid currentColor; }
  .pfoot { display: flex; align-items: center; gap: 10px; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
  .summary { flex: 1; min-width: 0; font-size: 13px; color: var(--ink-soft); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .summary b { color: var(--ink); }
  .btn {
    border: 0; cursor: pointer; border-radius: 999px; padding: 11px 20px; font-weight: 800; font-size: 14.5px;
    transition: transform .15s, background .2s, opacity .2s; white-space: nowrap;
  }
  .btn:active { transform: scale(.97); }
  .btn.primary { background: var(--cb-red); color: #fff; box-shadow: 0 3px 0 var(--cb-red-deep); }
  .btn.primary:hover { background: #E0544A; }
  .btn.primary:disabled { opacity: .45; cursor: default; }
  .btn.ghost { background: transparent; color: var(--ink-soft); padding-left: 10px; padding-right: 10px; }
  .btn.ghost:hover { color: var(--ink); }
  .btn.ghost:disabled { visibility: hidden; }

  .receipt { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 6px 18px; }
  .receipt div { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; padding: 6px 0; border-bottom: 1px dotted var(--line); }
  .receipt span { color: var(--ink-soft); font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; padding-top: 2px; }
  .receipt b { text-align: right; }
  .badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 800; padding: 4px 10px; border-radius: 999px; background: #E3F2DF; color: #2F6B34; }

  @media (max-width: 640px) {
    .panel { bottom: 10px; padding: 12px 12px 10px; border-radius: 20px; }
    h2 { font-size: 20px; }
    .hint { display: none; }
    .chips { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
    .chip { padding: 6px 8px 6px 6px; gap: 8px; border-radius: 14px; }
    .chip svg.sw { width: 36px; height: 36px; }
    .chip .nm { font-size: 13px; }
    .chip .sb { display: none; }
    .summary { display: none; }
    .pfoot { justify-content: space-between; margin-top: 10px; padding-top: 10px; }
  }
  /* ambient life */
  .eat { animation: eat 6s ease-in-out infinite; }
  @keyframes eat {
    0%, 82%, 100% { transform: none; }
    18%, 30% { transform: translate(-4px, -11px); }
    48%, 62% { transform: translate(-15px, 7px); }
  }
  .chew { transform-box: fill-box; transform-origin: center; animation: chew 6s ease-in-out infinite; }
  @keyframes chew { 0%, 46%, 80%, 100% { transform: none; } 54%, 70% { transform: scale(1.05); } 62% { transform: scale(.98); } }
  .yum { opacity: 0; animation: yum 15s ease-out infinite; }
  @keyframes yum { 0%, 86% { opacity: 0; transform: translateY(0); } 89% { opacity: 1; } 100% { opacity: 0; transform: translateY(-24px); } }
  .steam path { fill: none; stroke: #fff; stroke-width: 4; stroke-linecap: round; opacity: 0; animation: steam 3.4s ease-in-out infinite; }
  @keyframes steam { 0% { opacity: 0; transform: translateY(6px); } 40% { opacity: .55; } 100% { opacity: 0; transform: translateY(-24px); } }
  .flip { animation: flip 3.2s ease-in-out infinite; }
  @keyframes flip { 0%, 55%, 100% { transform: none; } 15%, 25% { transform: translate(-8px, 8px); } 32% { transform: translate(-8px, 12px) rotate(-8deg); } 40% { transform: translate(-6px, 6px); } }
  .chop { animation: chop 2.4s linear infinite; }
  @keyframes chop { 0%, 50%, 100% { transform: none; } 6%, 18%, 30%, 42% { transform: translate(0, 5px); } 12%, 24%, 36% { transform: translate(-3px, 0); } }
  .sarm { animation: sarm 7s ease-in-out infinite; }
  @keyframes sarm { 0%, 60%, 100% { transform: none; } 70%, 80% { transform: translate(-3px, 6px); } }
  .idle .body { transform-box: fill-box; transform-origin: center; animation: sway 4.5s ease-in-out infinite alternate; }
  @keyframes sway { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
  .walker .body { transform-box: fill-box; transform-origin: center; animation: waddle .38s ease-in-out infinite alternate; }
  .phone { animation: phone 5s ease-in-out infinite; }
  @keyframes phone { 0%, 100% { opacity: .9; } 50% { opacity: .55; } }

  @media (prefers-reduced-motion: reduce) {
    .eat, .chew, .yum, .steam path, .flip, .chop, .sarm, .idle .body, .walker .body, .phone { animation: none; }
    #cam, #tray, #me, #bubble { transition-duration: .01s; }
    .pop, .wrap-in, #bubbleInner.pop { animation-duration: .01s; }
    #me.walking .body, .staff.talk .bob { animation: none; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg viewBox="0 0 40 40" aria-hidden="true">
      <g fill="#F5B83D">

  <div id="cam"><svg id="scene" xmlns="http://www.w3.org/2000/svg"></svg></div>
  <div class="grain"></div>
  <div class="vignette"></div>
  <section class="panel" id="panel" aria-live="polite"></section>
</main>

<script>
(() => {

/* ================= Geometry ================= */
const PW = 112, PH = 100, PG = 14, PY = 232;
const Y = { wall: 36, back: 140, walk: 212, glass: 346, strip: 380, rail: 392, floor: 520 };
const H = 1500, TRAY_Y = 456, ME_Y = 590, STAFF_Y = 178;
let x = 330;
const PAY = STEPS.length - 1;
const ST = STEPS.slice(0, PAY).map(s => {
  const n = s.options.length, w = n * PW + (n - 1) * PG;
  const st = { ...s, x0: x, w, cx: x + w / 2 };
  x += w + 104;
  return st;
});
const REG = { x0: x, w: 300, cx: x + 150 };
const CX0 = ST[0].x0 - 60, CX1 = REG.x0 + REG.w + 30;
const W = CX1 + 600;
const focusX = i => (i < PAY ? ST[i].cx : REG.cx);
const panPos = (si, oi) => [ST[si].x0 + oi * (PW + PG), PY];

/* ================= Helpers ================= */
const f = n => (+n).toFixed(1);
function rng(seed) {
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const hash = s => { let h = 2166136261; for (const ch of s) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return h >>> 0; };
const gauss = r => (r() + r() + r() - 1.5) / 1.5;
const pick = (r, arr) => arr[Math.floor(r() * arr.length)];
const disc = (r, cx, cy, R) => { const a = r() * Math.PI * 2, d = Math.sqrt(r()) * R; return [cx + Math.cos(a) * d, cy + Math.sin(a) * d]; };

function shape(L, x, y, r) {
  const c = pick(r, L.c), rot = f(r() * 180), X = f(x), Y = f(y);
  const a = L.a || 3, b = L.b || a * .6, v = .8 + r() * .4;
  const T = `transform="translate(${X} ${Y}) rotate(${rot})"`;
  switch (L.k) {
    case 'grain': return `<ellipse rx="${f(a * v)}" ry="${f(b)}" fill="${c}" ${T}/>`;
    case 'fleck': return `<rect x="${f(-a / 2)}" y="${f(-a * .3)}" width="${f(a * v)}" height="${f(a * .6)}" rx=".5" fill="${c}" ${T}/>`;
    case 'bean': return `<g ${T}><ellipse rx="${f(a * v)}" ry="${f(b)}" fill="${c}"/><ellipse cx="${f(-a * .3)}" cy="${f(-b * .35)}" rx="${f(a * .4)}" ry="${f(b * .25)}" fill="#fff" opacity=".22"/>${L.speck ? `<circle cx="${f(a * .35)}" cy="${f(b * .2)}" r=".9" fill="${L.speck}"/><circle cx="${f(-a * .2)}" cy="${f(b * .4)}" r=".7" fill="${L.speck}"/>` : ''}</g>`;
    case 'chunk': { const w = a * v, h = b * (.8 + r() * .4);
      return `<g ${T}><rect x="${f(-w / 2)}" y="${f(-h / 2)}" width="${f(w)}" height="${f(h)}" rx="3.5" fill="${c}"/><rect x="${f(-w / 2 + 1.5)}" y="${f(-h / 2 + 1)}" width="${f(w * .5)}" height="${f(h * .3)}" rx="2" fill="#fff" opacity=".12"/>${L.grill ? `<path d="M${f(-w * .28)} ${f(-h / 2 + 1.5)}L${f(-w * .08)} ${f(h / 2 - 1.5)}M${f(w * .1)} ${f(-h / 2 + 1.5)}L${f(w * .3)} ${f(h / 2 - 1.5)}" stroke="${L.grill}" stroke-width="1.7" stroke-linecap="round" opacity=".55"/>` : ''}</g>`; }
    case 'cube': { const w = a * v, h = a * (.85 + r() * .25);
      return `<g ${T}><rect x="${f(-w / 2)}" y="${f(-h / 2)}" width="${f(w)}" height="${f(h)}" rx="${f(w * .22)}" fill="${c}" stroke="rgba(60,30,10,.1)" stroke-width=".6"/>${L.char ? `<rect x="${f(-w / 2)}" y="${f(h * .1)}" width="${f(w)}" height="${f(h * .3)}" rx="1.5" fill="${L.char}" opacity=".55"/>` : ''}</g>`; }
    case 'mush': return `<g ${T}><rect x="${f(-a * .28)}" y="-1" width="${f(a * .56)}" height="${f(a * .8)}" rx="${f(a * .2)}" fill="#D9C3A5"/><path d="M${f(-a)} 0A${f(a)} ${f(a * .85)} 0 0 1 ${f(a)} 0Z" fill="${c}"/><path d="M${f(-a * .8)} -.5H${f(a * .8)}" stroke="#5E4330" stroke-width=".9" opacity=".5"/></g>`;
    case 'strip': { const w = a * v; return `<rect x="${f(-w / 2)}" y="${f(-b / 2)}" width="${f(w)}" height="${f(b)}" rx="${f(b / 2)}" fill="${c}" ${T}/>`; }
    case 'kernel': return `<g ${T}><rect x="${f(-a / 2)}" y="${f(-b / 2)}" width="${f(a)}" height="${f(b)}" rx="1.3" fill="${c}"/><rect x="${f(-a / 2 + .6)}" y="${f(-b / 2 + .5)}" width="${f(a * .4)}" height="${f(b * .35)}" rx=".6" fill="#fff" opacity=".35"/></g>`;
    case 'blob': { const R = a * v; return `<g transform="translate(${X} ${Y})"><circle r="${f(R)}" fill="${c}"/><circle cx="${f(-R * .3)}" cy="${f(-R * .32)}" r="${f(R * .35)}" fill="#fff" opacity=".28"/></g>`; }
    case 'churro': { const w = a * v; return `<g ${T}><rect x="${f(-w / 2)}" y="${f(-b / 2)}" width="${f(w)}" height="${f(b)}" rx="${f(b / 2)}" fill="${c}"/><path d="M${f(-w / 2 + 4)} ${f(-b * .18)}H${f(w / 2 - 4)}M${f(-w / 2 + 4)} ${f(b * .18)}H${f(w / 2 - 4)}" stroke="#7A4A1E" stroke-width=".9" opacity=".4"/><rect x="${f(-w / 2 + 3)}" y="${f(-b / 2 + 1)}" width="${f(w * .5)}" height="1.6" rx=".8" fill="#fff" opacity=".25"/></g>`; }
    case 'brownie': { const w = a * v; return `<g ${T}><rect x="${f(-w / 2)}" y="${f(-w / 2)}" width="${f(w)}" height="${f(w)}" rx="3" fill="${c}"/><rect x="${f(-w / 2 + 2)}" y="${f(-w / 2 + 2)}" width="${f(w - 4)}" height="${f(w - 4)}" rx="2" fill="#fff" opacity=".06"/><path d="M${f(-w * .3)} ${f(-w * .1)}l${f(w * .2)} ${f(w * .08)} ${f(w * .15)} ${f(-w * .12)}M${f(-w * .1)} ${f(w * .22)}l${f(w * .25)} ${f(-w * .05)}" stroke="#E8C9A8" stroke-width=".9" fill="none" opacity=".35"/></g>`; }
    case 'wedge': { const R = a * v, x2 = f(R * Math.cos(1.05)), y2 = f(R * Math.sin(1.05)); return `<g ${T}><path d="M0 0L${f(R)} 0A${f(R)} ${f(R)} 0 0 1 ${x2} ${y2}Z" fill="${c}"/><path d="M${f(R - 1)} 2A${f(R - 1)} ${f(R - 1)} 0 0 1 ${f((R - 1) * Math.cos(1.0))} ${f((R - 1) * Math.sin(1.0))}" stroke="#4A2C1E" stroke-width="3.2" fill="none" stroke-linecap="round"/><path d="M${f(R * .35)} ${f(R * .05)}L${f(R * .22)} ${f(R * .3)}M${f(R * .6)} ${f(R * .08)}L${f(R * .42)} ${f(R * .55)}" stroke="#B9874A" stroke-width="1.6" stroke-linecap="round" opacity=".7"/></g>`; }
    case 'ring': return `<g ${T}><circle r="${f(a * v)}" fill="${c}"/><circle r="${f(a * v * .62)}" fill="#E4EEC4"/><circle cx="1.6" r="1" fill="#F6F2D6"/><circle cx="-1.2" cy="1.4" r="1" fill="#F6F2D6"/><circle cx="-.6" cy="-1.6" r="1" fill="#F6F2D6"/></g>`;
  }
  return '';
}
function texture(ing, pt, r, factor = 1) {
  let s = '';
  for (const L of ing.layers) { const n = Math.max(1, Math.round(L.n * factor)); for (let i = 0; i < n; i++) { const [x, y] = pt(); s += shape(L, x, y, r); } }
  return s;
}

/* ---- Base item art (inside a pan / swatch, 112x100) ---- */
function tortillaSpots(r, cx, cy, R, n) {
  let s = '';
  for (let i = 0; i < n; i++) { const [x, y] = disc(r, cx, cy, R); s += `<ellipse cx="${f(x)}" cy="${f(y)}" rx="${f(2 + r() * 3)}" ry="${f(1.5 + r() * 2)}" fill="#C99A57" opacity="${f(.25 + r() * .3)}"/>`; }
  return s;
}
function baseArt(id) {
  const r = rng(hash('art' + id)), cx = PW / 2, cy = PH / 2;
  if (id === 'burrito') {
    let s = '';
    for (let k = 0; k < 4; k++) s += `<circle cx="${cx + (k - 1.5) * 2.5}" cy="${cy + 6 - k * 3}" r="40" fill="${k === 3 ? '#F2DFB3' : '#E6CC96'}" stroke="#D2B47C" stroke-width="1.2"/>`;
    return s + tortillaSpots(r, cx + 1.5, cy - 3, 34, 14);
  }
  if (id === 'tacos') {
    let s = '';
    for (const ox of [-26, 26]) for (let k = 0; k < 3; k++) s += `<circle cx="${cx + ox + k}" cy="${cy + 6 - k * 3}" r="23" fill="${k === 2 ? '#F2DFB3' : '#E6CC96'}" stroke="#D2B47C" stroke-width="1"/>`;
    return s + tortillaSpots(r, cx - 24, cy - 1, 18, 5) + tortillaSpots(r, cx + 28, cy - 1, 18, 5);
  }
  if (id === 'bowl') {
    let s = '';
    for (let k = 0; k < 3; k++) s += `<circle cx="${cx + k * 2}" cy="${cy + 6 - k * 4}" r="39" fill="#DCBE91" stroke="#C3A06E" stroke-width="3"/>`;
    return s + `<circle cx="${cx + 4}" cy="${cy - 2}" r="30" fill="#D2B283"/><circle cx="${cx + 4}" cy="${cy - 2}" r="30" fill="none" stroke="#C3A06E" stroke-width="1" stroke-dasharray="2 4"/>`;
  }
  // salad
  const pt = () => disc(r, cx, cy, 31);
  return `<circle cx="${cx}" cy="${cy}" r="40" fill="#F7F3EA" stroke="#DCD5C7" stroke-width="3"/><circle cx="${cx}" cy="${cy}" r="34" fill="#C6DF94"/>` + texture(ING.lettuce, pt, r, .5);
}

function tomato(x, y) { return `<g transform="translate(${x} ${y})"><circle r="13" fill="#E2513F"/><circle cx="-4" cy="-4" r="4" fill="#fff" opacity=".25"/><path d="M0 -5l2 3 3-1-2 3 2 3-3-1-2 3-1-3-3 1 2-3-2-3 3 1z" fill="#4C8A3E"/></g>`; }

}

  }
  // sparkles
  for (let i = 0; i < 6; i++) { const a = i * 60 * Math.PI / 180; s += `<path class="sparkle" d="M${f(Math.cos(a) * 80)} ${f(Math.sin(a) * 60)}l${f(Math.cos(a) * 18)} ${f(Math.sin(a) * 14)}" stroke="var(--cb-yellow)" stroke-width="4" stroke-linecap="round" stroke-dasharray="30" style="animation-delay:.3s"/>`; }
  tWrap.innerHTML = `<g class="wrap-in">${s}</g>`;
  const bell = $('#bell'); bell.classList.remove('ding'); void bell.getBBox(); bell.classList.add('ding');
}

function reset() {
  for (const k in sel) sel[k].length = 0;
  maxStep = 0; step = 0;
  tray.classList.add('instant'); me.classList.add('instant');
  tray.style.opacity = 0;
  rebuildTray(); syncPans();
  trayX = null;
  moveTo(focusX(0));
  tray.offsetHeight;
  tray.classList.remove('instant'); me.classList.remove('instant');
  tray.style.transition = 'opacity .5s'; tray.style.opacity = 1;
  setTimeout(() => (tray.style.transition = ''), 520);
  go(0);
}

/* ---- events ---- */
panelEl.addEventListener('click', e => {
  const chip = e.target.closest('.chip'); if (chip) return choose(chip.dataset.id);
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (act === 'next') go(step + 1);
  if (act === 'back') go(Math.max(0, step - 1));
  if (act === 'again') reset();
});
svg.addEventListener('click', e => { const p = e.target.closest('.station.active .pan'); if (p) choose(p.dataset.id); });
document.getElementById('steps').addEventListener('click', e => { const b = e.target.closest('[data-step]'); if (b && !b.disabled) go(+b.dataset.step); });
addEventListener('keydown', e => {
  if (e.target.closest('input,textarea')) return;
  if (e.key === 'ArrowRight' && step < PAY && (!STEPS[step].required || sel[STEPS[step].id].length)) go(step + 1);
  if (e.key === 'ArrowLeft' && step > 0) go(step - 1);
});
new ResizeObserver(() => layout(true)).observe(stage);

layout(true);
if (matchMedia('(prefers-reduced-motion: reduce)').matches) svg.pauseAnimations();
go(0);
if (location.hash.startsWith('#demo')) { const [hn, hb] = location.hash.slice(5).split('-'); const n = +hn || PAY; const picks = [[hb || 'burrito'], ['lime_rice'], ['black_beans'], ['chicken'], ['pico', 'corn'], ['cheese', 'guac', 'sour_cream'], ['churros', 'brownies']]; matchMedia; for (let i = 0; i < Math.min(n, PAY); i++) { picks[i].forEach(id => sel[STEPS[i].id].push(id)); } maxStep = n; rebuildTray(); syncPans(); go(n); }
})();
</script>
</body>
