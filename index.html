<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Build Your Burrito</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%23D8463B'/%3E%3Cg transform='translate%281.5 1.5%29 scale%28.925%29'%3E%3Cg fill='%23F5B83D'%3E %3Cpath d='M20 11l2.5 0 5 3 2 4.5 0 4-2.5 5-4 2.5-5 0-4.5-2.5-2.5-5 .5-5 3-4z'/%3E %3Cpath d='M18.5 2h3l-.5 6h-2zM18.5 32h3l-.5 6h-2zM2 18.5v3l6-.5v-2zM32 18.5v3l6 .5v-3zM7 5l2-2 4 4.5-1.5 1.5zM29 33l2-2-4.5-4-1.5 1.5zM5 31l2 2 4.5-4-1.5-1.5zM33 7l-2-2-4 4.5 1.5 1.5z'/%3E %3C/g%3E %3Cpath d='M13 22c4-6 10-6 14 0-4 4-10 4-14 0z' fill='%23FFF5E6'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ---- Brand tokens (swap these to match the official palette) ---- */
  :root {
    --cb-red: #D8463B;
    --cb-red-deep: #A8342B;
    --cb-yellow: #F5B83D;
    --cb-cream: #FFF5E6;
    --cb-teal: #2E8C80;

    --ink: #3B2A23;
    --ink-soft: #7C665B;
    --paper: #FFF8EC;
    --paper-2: #F6EAD4;
    --mat: #2F6B55;
    --hand: "Patrick Hand", "Comic Sans MS", cursive;
    --noise: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .42  0 0 0 0 .3  0 0 0 0 .2  0 0 0 .5 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    --noise-soft: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .42  0 0 0 0 .3  0 0 0 0 .2  0 0 0 .16 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--mat);
    color: var(--ink);
    font-family: "Nunito", system-ui, sans-serif;
    display: grid;
    grid-template-rows: auto 1fr;
    grid-template-columns: minmax(0, 1fr);
    height: 100dvh; width: 100%;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }

  /* ---- Header: a strip of red construction paper with a torn edge ---- */
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 12px 20px 10px;
    background: var(--cb-red) var(--noise);
    background-blend-mode: multiply;
    color: var(--cb-cream);
    position: relative; z-index: 3;
  }
  header::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -9px; height: 10px;
    background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='10' preserveAspectRatio='none'><path d='M0 0H160V3L153 6 147 2 139 7 132 3 124 8 118 4 110 6 103 2 95 7 88 3 80 8 73 4 66 7 58 2 51 6 44 3 36 8 29 4 22 7 14 2 7 6 0 3Z' fill='%23D8463B'/></svg>") repeat-x;
    background-size: 160px 10px;
    filter: drop-shadow(0 3px 2px rgba(40, 20, 10, .25));
  }
  .brand { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .brand svg { width: 40px; height: 40px; }
  .brand b { font-family: var(--hand); font-weight: 400; font-size: 26px; display: block; line-height: 1; }
  .brand small { font-size: 12px; opacity: .85; font-weight: 700; display: block; margin-top: 5px; }
  .brand a { color: inherit; text-decoration: underline; text-decoration-color: rgba(255, 245, 230, .55); text-underline-offset: 2px; }
  .brand a:hover { text-decoration-color: currentColor; }
  .steps { display: flex; gap: 6px; margin-left: auto; min-width: 0; overflow-x: auto; scrollbar-width: none; padding: 4px 2px 6px; }
  .steps::-webkit-scrollbar { display: none; }
  .steps button {
    border: 0; cursor: pointer; white-space: nowrap;
    background: rgba(255, 245, 230, .16);
    color: var(--cb-cream);
    font-family: var(--hand); font-size: 18px;
    padding: 4px 12px 3px; border-radius: 3px;
    display: flex; align-items: center; gap: 6px;
    transform: rotate(var(--r, 0deg));
  }
  .steps button .n { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 14px; background: rgba(255, 245, 230, .2); }
  .steps button.done .n { background: var(--cb-yellow); color: var(--cb-red-deep); }
  .steps button.cur { background: var(--paper); color: var(--cb-red-deep); box-shadow: 2px 3px 0 rgba(60, 20, 10, .3); }
  .steps button.cur .n { background: var(--cb-red); color: var(--cb-cream); }
  .steps button:disabled { opacity: .45; cursor: default; }
  @media (max-width: 760px) {
    header { padding: 10px 14px 8px; gap: 8px; }
    .brand { gap: 6px; }
    .brand svg { width: 30px; height: 30px; }
    .brand small { font-size: 11px; line-height: 1.2; margin-top: 3px; }
    .brand b { font-size: 19px; }
    .steps { gap: 2px; overflow: visible; padding: 0; }
    .steps button, .steps button.cur { width: 15px; height: 26px; padding: 0; background: none; box-shadow: none; justify-content: center; transform: none; }
    .steps button.cur { width: 28px; }
    .steps button .t { display: none; }
    .steps button .n { width: 9px; height: 9px; font-size: 0; background: rgba(255, 245, 230, .35); }
    .steps button.done .n { background: var(--cb-yellow); }
    .steps button.cur .n { width: 24px; border-radius: 5px; background: var(--paper); }
  }

  /* ---- Loader: a tortilla gets filled, rolled and foil-wrapped (stop-motion steps) ---- */
  .loader { position: fixed; inset: 0; z-index: 20; display: grid; place-content: center; justify-items: center; gap: 6px; background: var(--paper); color: var(--ink); transition: transform .6s steps(6, end); }
  .loader.out { transform: translateY(-104%); }
  .loader svg { width: min(260px, 64vw); height: auto; filter: drop-shadow(3px 5px 0 rgba(59, 42, 35, .18)); }
  .loader p { margin: 0; font-family: var(--hand); font-size: 22px; color: var(--ink-soft); }
  .ld-open, .ld-roll, .ld-fill, .ld-foil, .ld-sticker { transform-box: fill-box; }
  .ld-fill { animation: ldFill 2.8s steps(1) infinite; }
  .ld-open { transform-origin: center; animation: ldOpen 2.8s steps(1) infinite; }
  .ld-roll { transform-origin: center; animation: ldRoll 2.8s steps(1) infinite; }
  .ld-foil { animation: ldFoil 2.8s steps(1) infinite; }
  .ld-sticker { transform-origin: center; animation: ldSticker 2.8s steps(1) infinite; }
  @keyframes ldFill { 0% { opacity: 0; } 8% { opacity: 1; clip-path: inset(0 70% 0 0); } 15% { clip-path: inset(0 40% 0 0); } 22% { clip-path: inset(0 0 0 0); } }
  @keyframes ldOpen { 0%, 32% { opacity: 1; transform: none; } 36% { transform: scaleY(.66); } 40% { transform: scaleY(.46); } 44%, 100% { opacity: 0; } }
  @keyframes ldRoll { 0%, 40% { opacity: 0; transform: scaleY(.6); } 44% { opacity: 1; transform: scaleY(1.08); } 48%, 100% { opacity: 1; transform: none; } }
  @keyframes ldFoil { 0%, 54% { transform: translateX(-104%); } 58% { transform: translateX(-75%); } 62% { transform: translateX(-46%); } 66% { transform: translateX(-20%); } 70%, 100% { transform: none; } }
  @keyframes ldSticker { 0%, 74% { opacity: 0; transform: scale(1.6) rotate(-20deg); } 78% { opacity: 1; transform: scale(.9); } 82%, 94% { opacity: 1; transform: none; } 97%, 100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .ld-fill, .ld-open, .ld-roll, .ld-foil, .ld-sticker { animation: none; }
    .ld-open { opacity: 0; }
    .loader { transition: none; }
  }

  /* ---- Stage ---- */
  .stage { position: relative; overflow: hidden; background: var(--mat); }
  #cam {
    position: absolute; left: 0; top: 0;
    transform-origin: 0 0;
    will-change: transform;
  }
  /* the scene is a stack of svg sheets; static ones are drawn once and cached, so small animations never repaint the whole kitchen */
  .lay { position: absolute; left: 0; top: 0; display: block; overflow: visible; pointer-events: none; }
  .lay.hit { pointer-events: auto; }
  .grain { position: absolute; inset: 0; pointer-events: none; opacity: .45; mix-blend-mode: multiply; background-image: var(--noise); }
  .blotch {
    position: absolute; inset: 0; pointer-events: none; opacity: .5; mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='600'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.012' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .38  0 0 0 0 .25  0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  .vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(120% 95% at 50% 40%, transparent 50%, rgba(40, 25, 10, .32)); }
  /* stop-motion exposure flicker */
  .flicker { position: absolute; inset: 0; pointer-events: none; background: #fff6e0; mix-blend-mode: soft-light; animation: flicker 1.3s steps(1) infinite; }
  @keyframes flicker { 0% { opacity: .05; } 23% { opacity: .11; } 41% { opacity: .03; } 64% { opacity: .09; } 82% { opacity: .06; } }

  /* ---- SVG behaviour ---- */
  .pan .lift { transition: transform .2s steps(2, end); }
  .station:not(.active) .pan { pointer-events: none; }
  .station.active .pan { cursor: pointer; }
  .station.active .pan:hover .lift { transform: translate(-2px, -5px); }
  .mark .ring, .mark .tick { stroke-dasharray: 1000; stroke-dashoffset: 1000; transition: stroke-dashoffset .45s steps(5, end); }
  .mark .tickbg { opacity: 0; filter: drop-shadow(1px 1.5px 0 rgba(59, 42, 35, .25)); }
  .mark.on .ring, .mark.on .tick { stroke-dashoffset: 0; }
  .mark.on .tickbg { opacity: 1; }
  .glow { transition: opacity .6s steps(4); opacity: .15; }
  .glow.on { opacity: .6; }

  .boil { transform-box: fill-box; transform-origin: 50% 80%; animation: boil .75s steps(1) infinite; }
  @keyframes boil { 0% { transform: rotate(.7deg); } 33% { transform: rotate(-.6deg) translate(.6px, .3px); } 66% { transform: rotate(.2deg) translate(-.5px, -.2px); } }
  .eyes { transform-box: fill-box; transform-origin: center; animation: blink 5s steps(1) infinite; }
  @keyframes blink { 0%, 94% { transform: none; } 95% { transform: scaleY(.15); } 98% { transform: none; } }
  .mouth { opacity: 0; }
  .talk .mouth { animation: talk .5s steps(1) infinite; }
  .talk .smile { animation: talk .5s steps(1) infinite reverse; }
  @keyframes talk { 0% { opacity: 1; } 50% { opacity: 0; } }
  .talk .hop { animation: hop .5s steps(1) infinite; }
  @keyframes hop { 0% { transform: translateY(-3px); } 50% { transform: none; } }
  .chewing .mouth { animation: chew 6s steps(1) infinite; animation-delay: inherit; }
  @keyframes chew { 0%, 50%, 80% { opacity: 0; } 55%, 65%, 75% { opacity: 1; } 60%, 70% { opacity: 0; } }

  #me.walking .legA, .q.walking .legA { animation: legA .5s steps(1) infinite; }
  #me.walking .legB { animation: legA .5s steps(1) infinite reverse; }
  @keyframes legA { 0% { transform: translateY(-6px); } 50% { transform: none; } }
  #me.walking .hop2 { animation: hop .25s steps(1) infinite; }
  .wk .fB, .wk.alt .fA { display: none; }
  #me .armsUp, #me.holding .armsDown { display: none; }
  #me.holding .armsUp { display: inline; }
  .wk.alt .fB { display: inline; }
  .sway { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 3.2s steps(1) infinite; }
  @keyframes sway { 0% { transform: rotate(-2deg); } 25% { transform: rotate(0); } 50% { transform: rotate(2deg); } 75% { transform: rotate(0); } }
  .flag { transform-box: fill-box; transform-origin: 50% 0; animation: flag 2.4s steps(1) infinite; }
  @keyframes flag { 0% { transform: rotate(4deg); } 33% { transform: rotate(-3deg); } 66% { transform: rotate(1deg); } }
  .steam path { fill: none; stroke: #fff; stroke-width: 5; stroke-linecap: round; opacity: 0; animation: steam 3s steps(6, end) infinite; }
  @keyframes steam { 0% { opacity: 0; transform: translateY(6px); } 30% { opacity: .85; } 100% { opacity: 0; transform: translateY(-26px); } }
  .bub { animation: bub 1.4s steps(1) infinite; opacity: 0; }
  @keyframes bub { 0% { opacity: 0; } 25% { opacity: .9; } 55% { opacity: .5; } 80% { opacity: 0; } }
  .flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flame .5s steps(1) infinite; }
  @keyframes flame { 0% { transform: none; opacity: 1; } 50% { transform: scale(.8, .7); opacity: .7; } }
  .toss { transform-box: fill-box; transform-origin: center; animation: toss 2.4s steps(1) infinite; }
  @keyframes toss { 0%, 70% { transform: none; } 74% { transform: translate(-4px, -10px); } 79% { transform: translate(-6px, -20px) rotate(6deg); } 85% { transform: translate(-3px, -9px) rotate(2deg); } 90% { transform: none; } }
  .shake2 { animation: shake2 1.6s steps(1) infinite; }
  @keyframes shake2 { 0%, 60% { transform: none; } 65% { transform: translateY(-5px); } 72% { transform: translateY(1px); } 79% { transform: translateY(-4px); } 86% { transform: none; } }
  .draw { stroke-dasharray: 101; stroke-dashoffset: 101; animation: draw .6s steps(6, end) forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .yum { opacity: 0; animation: yum 15s steps(1) infinite; }
  @keyframes yum { 0%, 86% { opacity: 0; transform: none; } 88% { opacity: 1; transform: translateY(-4px); } 92% { opacity: 1; transform: translateY(-12px); } 96% { opacity: 1; transform: translateY(-20px) scale(.8); } 99% { opacity: 0; } }

  .pop { animation: pop .4s steps(3, end) both; transform-box: fill-box; transform-origin: center; }
  @keyframes pop { from { opacity: 0; transform: scale(1.3) translateY(-10px) rotate(-6deg); } to { opacity: 1; transform: none; } }
  .fade-out { transition: opacity .3s steps(2); opacity: 0; }
  #bubbleInner { transform-box: fill-box; transform-origin: 0 50%; }
  #bubbleInner.pop { animation: bpop .36s steps(3, end) both; }
  @keyframes bpop { from { opacity: 0; transform: scale(.5) rotate(-8deg); } to { opacity: 1; transform: none; } }
  .wrap-in { animation: wrapin .6s steps(4, end) both; transform-box: fill-box; transform-origin: center; }
  @keyframes wrapin { from { opacity: 0; transform: scale(1.4) rotate(-14deg); } to { opacity: 1; transform: none; } }
  .shrink { transition: opacity .4s steps(3), transform .4s steps(3); opacity: 0; transform: scaleY(.4); transform-box: fill-box; transform-origin: center; }
  .ding { animation: ding .5s steps(2) 3; transform-box: fill-box; transform-origin: center; }
  @keyframes ding { 25% { transform: rotate(-16deg); } 75% { transform: rotate(16deg); } }
  .sparkle { animation: sparkle 1s steps(4) both; }
  @keyframes sparkle { from { opacity: 1; transform: scale(.6); } to { opacity: 0; transform: scale(1.2); } }
  .sparkle { transform-box: fill-box; transform-origin: center; }

  /* ---- Panel: a sheet of paper taped onto the scene ---- */
  .panel {
    position: absolute; left: 50%; bottom: 14px;
    transform: translateX(-50%) rotate(-.4deg);
    width: min(900px, calc(100% - 28px));
    background: var(--paper) var(--noise-soft);
    background-blend-mode: multiply;
    border-radius: 3px;
    box-shadow: 3px 6px 0 rgba(30, 20, 10, .22), 0 14px 30px -12px rgba(0, 0, 0, .45);
    padding: 18px 20px 14px;
    z-index: 2;
  }
  .panel::before, .panel::after {
    content: ""; position: absolute; top: -12px; width: 96px; height: 26px;
    background: rgba(238, 225, 186, .82);
    clip-path: polygon(3% 8%, 10% 0, 18% 10%, 27% 2%, 36% 9%, 46% 0, 56% 8%, 66% 1%, 76% 9%, 86% 2%, 94% 9%, 100% 4%, 98% 92%, 90% 100%, 80% 91%, 70% 99%, 60% 92%, 50% 100%, 40% 91%, 30% 99%, 20% 92%, 10% 100%, 1% 94%);
    box-shadow: 0 1px 2px rgba(0, 0, 0, .1);
  }
  .panel::before { left: 28px; transform: rotate(-5deg); }
  .panel::after { right: 30px; transform: rotate(4deg); }
  .phead { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .kicker { font-family: var(--hand); font-size: 18px; color: var(--cb-red); line-height: 1; }
  h2 { font-family: var(--hand); font-weight: 400; font-size: 34px; margin: 2px 0 0; line-height: 1; }
  .hint { font-family: var(--hand); font-size: 18px; color: var(--ink-soft); text-align: right; }
  .chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
  .chip {
    min-width: 0;
    display: flex; align-items: center; gap: 10px; text-align: left;
    padding: 8px 12px 8px 8px;
    border: 0; border-radius: 2px;
    background: #fff var(--noise-soft);
    background-blend-mode: multiply;
    box-shadow: 2px 3px 0 rgba(59, 42, 35, .18);
    cursor: pointer; position: relative;
    transform: rotate(var(--r, 0deg));
    transition: transform .15s steps(2), box-shadow .15s steps(2), background-color .1s;
  }
  .chip:hover { transform: rotate(var(--r, 0deg)) translate(-1px, -3px); box-shadow: 4px 6px 0 rgba(59, 42, 35, .18); }
  .chip.on { background-color: #FFE08A; }
  .chip.shake { animation: shake .3s steps(3); }
  @keyframes shake { 33% { transform: translateX(-5px) rotate(-2deg); } 66% { transform: translateX(5px) rotate(2deg); } }
  .chips.dense { grid-template-columns: repeat(auto-fill, minmax(156px, 1fr)); gap: 8px; }
  .chips.dense .chip { padding: 5px 8px 5px 5px; gap: 8px; }
  .chips.dense .chip svg.sw { width: 36px; height: 36px; }
  .chips.dense .chip .nm { font-size: 17px; }
  .chips.dense .chip .sb { display: none; }
  .chip svg.sw { width: 46px; height: 46px; flex-shrink: 0; filter: drop-shadow(1px 2px 0 rgba(59, 42, 35, .22)); }
  /* name and description share one left edge; the veg mark hangs in its own column beside the first line */
  .chip .tx { flex: 1; min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr); align-content: center; }
  .chip .tx.hasvm { grid-template-columns: 12px minmax(0, 1fr); column-gap: 7px; }
  .chip .tx .vm { grid-column: 1; grid-row: 1; margin-top: .3em; }
  .chip .nm { grid-column: -2; font-family: var(--hand); font-size: 20px; line-height: 1.1; }
  .chip .sb { grid-column: -2; font-size: 12.5px; color: var(--ink-soft); font-weight: 700; line-height: 1.3; margin-top: 3px; }
  .chip .ck { position: absolute; top: -10px; right: -6px; width: 34px; height: 34px; opacity: 0; transition: opacity .1s steps(1); }
  .chip.on .ck { opacity: 1; }
  .vm { width: 12px; height: 12px; border: 1.6px solid; border-radius: 2px; display: inline-grid; place-items: center; flex-shrink: 0; }
  .vm::after { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
  .vm.veg { color: #2F8F3A; }
  .vm.nv { color: #9A3B24; }
  .vm.nv::after { border-radius: 0; width: 0; height: 0; background: none; border-left: 3.5px solid transparent; border-right: 3.5px solid transparent; border-bottom: 6px solid currentColor; }
  .pfoot { display: flex; align-items: baseline; gap: 10px; margin-top: 14px; padding-top: 12px; border-top: 2px dashed rgba(59, 42, 35, .2); }
  .summary { flex: 1; min-width: 0; font-family: var(--hand); font-size: 18px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .summary b { color: var(--ink); font-weight: 400; }
  .btn { border: 0; cursor: pointer; padding: 9px 20px 7px; font-family: var(--hand); font-size: 21px; white-space: nowrap; border-radius: 2px; transition: transform .12s steps(2), box-shadow .12s steps(2); }
  .btn.primary { background: var(--cb-red) var(--noise-soft); background-blend-mode: multiply; color: #fff; box-shadow: 3px 4px 0 #7E2720; transform: rotate(.8deg); }
  .btn.primary:hover { transform: rotate(.8deg) translate(-1px, -2px); box-shadow: 4px 6px 0 #7E2720; }
  .btn.primary:active { transform: rotate(.8deg) translate(2px, 3px); box-shadow: 1px 1px 0 #7E2720; }
  .btn.primary:disabled { opacity: .45; cursor: default; }
  .btn.ghost { background: transparent; color: var(--ink-soft); padding-left: 6px; padding-right: 6px; text-decoration: underline wavy rgba(59, 42, 35, .3); text-underline-offset: 5px; }
  .btn.ghost:hover { color: var(--ink); }
  .btn.ghost:disabled { visibility: hidden; }
  .receipt { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 0 22px; }
  .receipt div { display: flex; flex-direction: column; gap: 1px; padding: 6px 0 5px; border-bottom: 2px dotted rgba(59, 42, 35, .18); }
  .receipt span { font-family: var(--hand); color: var(--ink-soft); font-size: 16px; line-height: 1.1; }
  .receipt b { font-family: var(--hand); font-weight: 400; font-size: 20px; line-height: 1.2; }
  .rsum, .rtoggle { display: none; }
  .rsum { font-family: var(--hand); font-size: 17px; line-height: 1.3; color: var(--ink); }
  .rtoggle { border: 0; background: none; padding: 4px 0 0; cursor: pointer; font-family: var(--hand); font-size: 16px; color: var(--cb-red); text-decoration: underline wavy rgba(216, 70, 59, .4); text-underline-offset: 4px; }
  .stamps { display: flex; gap: 10px; align-items: center; flex-shrink: 0; }

/* ---- SMIL rotation sampled at ~8fps, discrete = stop motion ---- */
function smilRot(keys, dur, delay = 0, fps = 8) {
  const n = Math.max(2, Math.round(dur * fps)), vals = [];
  for (let i = 0; i < n; i++) {

    while (k < keys.length - 2 && t > keys[k + 1][0]) k++;

    const u = t1 > t0 ? Math.min(1, Math.max(0, (t - t0) / (t1 - t0))) : 1;
    const e = u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
    vals.push(f(a0 + (a1 - a0) * e));
